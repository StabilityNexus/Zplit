# Nginx configuration for Zplit React SPA
# Handles client-side routing by fallback to index.html for all non-file requests

server {
    listen 80;
    server_name _;

    # Serve static files from the Vite build output
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing: fallback all non-file requests to index.html
    # This allows client-side routing to work with direct URL navigation
    location / {
        try_files $uri $uri/ /index.html;
        # Cache index.html for a short period
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
